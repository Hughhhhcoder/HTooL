name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please confirm that the problem reproduces on the latest live version or the `master` branch.

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Chrome 128 / Safari 18
    validations:
      required: true

  - type: input
    id: tool
    attributes:
      label: Affected tool or page
      placeholder: e.g. Markdown editor, QR code tool
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest reproducible path in order.
      placeholder: |
        1. Open …
        2. Enter …
        3. Click …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, console errors, operating-system details, or other context. Remove sensitive data first.
